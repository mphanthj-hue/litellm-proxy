model_list:
  - model_name: gpt-4o
    litellm_params:
      model: azure/my_azure_deployment
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: "2025-01-01-preview"

  # ===== OpenCode Zen v1 (Free Models) =====
  # api_key: "public" — OpenCode Zen chấp nhận mọi key cho public models
  - model_name: big-pickle
    litellm_params:
      model: openai/big-pickle
      api_base: https://opencode.ai/zen/v1
      api_key: "public"

  - model_name: deepseek-v4-flash-free
    litellm_params:
      model: openai/deepseek-v4-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: "public"

  - model_name: laguna-s-2.1-free
    litellm_params:
      model: openai/laguna-s-2.1-free
      api_base: https://opencode.ai/zen/v1
      api_key: "public"

  - model_name: ling-3.0-flash-free
    litellm_params:
      model: openai/ling-3.0-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: "public"

  - model_name: mimo-v2.5-free
    litellm_params:
      model: openai/mimo-v2.5-free
      api_base: https://opencode.ai/zen/v1
      api_key: "public"

  - model_name: nemotron-3-ultra-free
    litellm_params:
      model: openai/nemotron-3-ultra-free
      api_base: https://opencode.ai/zen/v1
      api_key: "public"

  - model_name: north-mini-code-free
    litellm_params:
      model: openai/north-mini-code-free
      api_base: https://opencode.ai/zen/v1
      api_key: "public"

general_settings:
  master_key: sk-1234
  # database_url is only needed when STORE_MODEL_IN_DB=true
  # For Railway (no postgres), leave unset and set STORE_MODEL_IN_DB=False in Dockerfile
